initContainers:
- name: wait-for-mysql
  image: mysql:8.0
  command:
    - sh
    - -c
    - |
      echo "⏳ Waiting for MySQL table 'users'..."
      until mysql -h $MYSQL_HOST -u $MYSQL_USER -p$MYSQL_PASSWORD -D $MYSQL_DATABASE -e "SELECT 1 FROM users LIMIT 1"; do
        echo "⏳ Retrying MySQL connection..."
        sleep 5
      done
      echo "✅ MySQL 'users' table is available!"
  env:
    - name: MYSQL_HOST
      valueFrom:
        secretKeyRef:
          name: mysql-secret
          key: MYSQL_HOST
    - name: MYSQL_USER
      valueFrom:
        secretKeyRef:
          name: mysql-secret
          key: MYSQL_USER
    - name: MYSQL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: mysql-secret
          key: MYSQL_PASSWORD
    - name: MYSQL_DATABASE
      valueFrom:
        secretKeyRef:
          name: mysql-secret
          key: MYSQL_DATABASE
